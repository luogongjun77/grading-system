services:
  - type: web
    name: grading-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: demo
      - key: DATA_DIR
        value: /data
    disk:
      name: grading-data
      mountPath: /data
      sizeGB: 1
