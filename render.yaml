services:
  - type: web
    name: grading-system
    runtime: python
    buildCommand: apt-get update && apt-get install -y libmupdf-dev mupdf-tools && pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: demo
